
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bloom & Brew | Contact</title>

  <link rel="stylesheet" href="assets/style/bootstrap.min.css">
  <link rel="stylesheet" href="assets/style/style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg bg-body-tertiary sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <img src="assets/images/logo.jpg" alt="Logo" height="55">
        <span class="ms-2">Bloom & Brew</span>
      </a>

      <button class="navbar-toggler" type="button"
        data-bs-toggle="collapse" data-bs-target="#navbarMenu"
        aria-controls="navbarMenu" aria-expanded="false"
        aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="menu.html">Menu</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="contact.html">Contact</a>
          </li>
        </ul>
        <button class="btn btn-outline-dark ms-lg-3 mt-2 mt-lg-0"
          id="themeButton" type="button" onclick="toggleTheme()">
          Dark Mode
        </button>
      </div>
    </div>
  </nav>

  <section class="container py-5">
    <h1 class="section-title text-center">Contact Us</h1>
    <p class="text-center mb-5">
      Have a question? We'd love to hear from you!
    </p>

    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">

        <div class="card shadow-sm p-4">
          <form id="contactForm" novalidate>

            <div class="mb-3">
              <label for="name" class="form-label">Full Name</label>
              <input type="text" class="form-control"
                id="name" placeholder="Your name">
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Email Address</label>
              <input type="email" class="form-control"
                id="email" placeholder="example@email.com">
            </div>

            <div class="mb-3">
              <label for="message" class="form-label">Your Message</label>
              <textarea class="form-control" id="message"
                rows="5" placeholder="Write your message..."></textarea>
            </div>

            <div id="formResult" role="status" aria-live="polite"></div>

            <button type="submit" class="btn btn-coffee w-100">
              Send Message
            </button>

          </form>
        </div>

      </div>
    </div>
  </section>

  <footer class="text-center py-4">
    <p class="mb-0">© 2026 Bloom & Brew. Made with ☕</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="./assets/script/script.js"></script>
</body>
</html>
