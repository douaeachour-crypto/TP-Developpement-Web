<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/EXE4/style.css" rel="stylesheet">
    <title>EXE4</title>
</head>
<body>
    <header><h1><i><font color="brown" ><u>SOMME</u></font></i></h1></header>
    <form id="temps">
    <p>Entrer le premier temps :</p>
    <label for="h1">Heure(s)</label>
    <input type="number" id="h1" min="0" value="0">
    <label for="m1">Minute(s)</label>
    <input type="number" id="m1" min="0" value="0">
    <label for="s1">Seconde(s)</label>
    <input type="number" id="s1" min="0" value="0">
    <p>Entrer le 2iéme temps :</p>
    <label for="h2">Heure(s)</label>
    <input type="number" id="h2" min="0" value="0">
    <label for="m2">Minute(s)</label>
    <input type="number" id="m2" min="0" value="0">
    <label for="s2">Seconde(s)</label>
    <input type="number" id="s2" min="0" value="0">
    <p>Entrer le 3iéme temps :</p>
    <label for="h3">Heure(s)</label>
    <input type="number" id="h3" min="0" value="0">
    <label for="m3">Minute(s)</label>
    <input type="number" id="m3" min="0" value="0">
    <label for="s3">Seconde(s)</label>
    <input type="number" id="s3" min="0" value="0">
</form>
<p>Total des trois temps :</p>
<label for="jours">Jour(s)</label>
<input type="number" id="jours" readonly>
<label for="heures">Heure(s)</label>
<input type="number" id="heures" readonly>
<label for="minutes">Minute(s)</label>
<input type="number" id="minutes" readonly>
<label for="secondes">Seconde(s)</label>
<input type="number" id="secondes" readonly>
<br><br>
<button type="button" id="but" onclick="somme()">Somme</button>
<button type="reset" id="but">Effacer</button>
<script src="/EXE4/script.js"></script>
</body>
</html>
